<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Completo de Aprendices - SENA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow-lg border-0 rounded-lg">
                    <div class="card-header bg-success text-white text-center py-3">
                        <h3 class="mb-0 fw-bold">Sistema de Gestión de Aprendices</h3>
                    </div>
                    <div class="card-body p-4">
                        <form action="controlador/logica.php" method="post">
                            
                            <!-- SECCIÓN 1: Identificación y Contacto -->
                            <h5 class="text-success border-bottom pb-2 mb-3"><i class="bi bi-person-badge"></i> Identificación y Contacto</h5>
                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <label class="form-label">Tipo Doc:</label>
                                    <select name="tipo_doc" class="form-select" required>
                                        <option value="CC">Cédula (CC)</option>
                                        <option value="TI">T. Identidad (TI)</option>
                                        <option value="CE">C. Extranjería (CE)</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Número Documento:</label>
                                    <input type="text" name="num_doc" required class="form-control" placeholder="Ej. 1002345678">
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label">Nombre Completo:</label>
                                    <input type="text" name="nom" required class="form-control" placeholder="Ej. Juan Diego...">
                                </div>
                            </div>
                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">Correo Electrónico:</label>
                                    <input type="email" name="correo" required class="form-control" placeholder="correo@ejemplo.com">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Teléfono:</label>
                                    <input type="number" name="tel" required min="3000000000" max="4000000000" class="form-control" placeholder="320...">
                                </div>
                            </div>

                            <!-- SECCIÓN 2: Datos Académicos -->
                            <h5 class="text-success border-bottom pb-2 mb-3"><i class="bi bi-book"></i> Datos Académicos</h5>
                            <div class="row mb-3">
                                <div class="col-md-3">
                                    <label class="form-label">Número de Ficha:</label>
                                    <input type="text" name="ficha" required class="form-control" placeholder="Ej. 200997">
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label">Programa de Formación:</label>
                                    <select name="programa" class="form-select" required>
                                        <option value="" disabled selected>Seleccione...</option>
                                        <option value="Análisis y Desarrollo de Software">Análisis y Desarrollo de Software</option>
                                        <option value="Gestión Logística">Gestión Logística</option>
                                        <option value="Asistencia Administrativa">Asistencia Administrativa</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Jornada:</label>
                                    <select name="jornada" class="form-select" required>
                                        <option value="Mañana">Mañana</option>
                                        <option value="Tarde">Tarde</option>
                                        <option value="Noche">Noche</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Estado:</label>
                                    <select name="estado" class="form-select" required>
                                        <option value="Activo">Activo</option>
                                        <option value="Productiva">Productiva</option>
                                        <option value="Aplazado">Aplazado</option>
                                        <option value="Desertado">Desertado</option>
                                    </select>
                                </div>
                            </div>

                            <!-- SECCIÓN 3: Calificaciones y Observaciones -->
                            <h5 class="text-success border-bottom pb-2 mb-3 mt-4"><i class="bi bi-journal-check"></i> Calificaciones</h5>
                            <div class="row mb-3">
                                <div class="col-md-4">
                                    <label class="form-label">Nota 1:</label>
                                    <input type="number" step="0.1" min="0" max="5" name="nota1" required class="form-control text-center text-primary fw-bold">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Nota 2:</label>
                                    <input type="number" step="0.1" min="0" max="5" name="nota2" required class="form-control text-center text-primary fw-bold">
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Nota 3:</label>
                                    <input type="number" step="0.1" min="0" max="5" name="nota3" required class="form-control text-center text-primary fw-bold">
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label">Detalles u observaciones:</label>
                                <textarea name="det" required class="form-control" rows="2" placeholder="Escribe aquí las observaciones..."></textarea>
                            </div>

                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">Guardar Registro Completo</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
